<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181d26" media="(prefers-color-scheme: dark)" />
    <title>MUN Hub</title>
    <!-- Site-wide social card for crawlers that don't run JavaScript. Pages
         that render their own tags (components/seo/page-meta.tsx) remove
         everything marked data-default-seo on mount. -->
    <meta
      name="description"
      content="Browse reviewed Model United Nations conferences, compare committees and fees, and register for your next MUN in minutes."
      data-default-seo
    />
    <meta property="og:site_name" content="MUN Hub" data-default-seo />
    <meta property="og:type" content="website" data-default-seo />
    <meta property="og:title" content="MUN Hub — Find and register for Model UN conferences" data-default-seo />
    <meta property="og:description" content="Browse reviewed Model United Nations conferences, compare committees and fees, and register for your next MUN in minutes." data-default-seo />
    <meta property="og:image" content="https://www.munhub.in/og-default.png" data-default-seo />
    <meta property="og:image:width" content="1200" data-default-seo />
    <meta property="og:image:height" content="630" data-default-seo />
    <meta property="og:image:alt" content="MUN Hub — find and register for Model UN conferences" data-default-seo />
    <meta name="twitter:card" content="summary_large_image" data-default-seo />
    <meta name="twitter:title" content="MUN Hub — Find and register for Model UN conferences" data-default-seo />
    <meta name="twitter:description" content="Browse reviewed Model United Nations conferences, compare committees and fees, and register for your next MUN in minutes." data-default-seo />
    <meta name="twitter:image" content="https://www.munhub.in/og-default.png" data-default-seo />
    <!-- Sitewide, not per-page — stays after data-default-seo tags are stripped. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MUN Hub",
        "url": "https://www.munhub.in",
        "logo": "https://www.munhub.in/apple-touch-icon.png",
        "sameAs": ["https://instagram.com/munhub.in"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
    </style>
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root" class="flex min-h-full flex-1 flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
