name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run. Tick "e2e" to also run the Playwright suite.
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the end-to-end suite
        type: boolean
        default: false
  # Nightly end-to-end run, 02:30 IST.
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

# A new push to a pull request supersedes the previous run. Every other run
# (pushes to main, manual and nightly runs) is grouped by commit, so nothing
# cancels it and each commit on main keeps its own result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  WRANGLER_SEND_METRICS: "false"

jobs:
  web:
    name: Web (typecheck, lint, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Lint web
        working-directory: web
        run: npx oxlint

      # oxlint only lives in web/node_modules; the root script calls it directly.
      - name: Lint lib, server and E2E
        run: npm run lint:shared

      - name: Build
        working-directory: web
        run: npx vite build

  server:
    name: Server and shared code (typecheck, bundle)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Typecheck lib and server integration tests
        run: npm run typecheck:root

      - name: Typecheck E2E
        run: npm run typecheck:e2e

      # Bundles the Worker exactly as a deploy would (no upload, no
      # credentials), which catches config and bundling errors tsc can't.
      - name: Bundle API worker
        working-directory: server
        run: npx wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/api-bundle"

  test:
    name: Unit and integration tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mun_hub
          POSTGRES_PASSWORD: mun_hub_dev
          POSTGRES_DB: mun_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mun_hub -d mun_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # vitest.setup.ts loads .env.test with dotenv, which never overrides a
      # variable that's already set, so this explicit value is what the tests
      # use. It's the same local database .env.test names.
      DATABASE_URL: postgresql://mun_hub:mun_hub_dev@localhost:5432/mun_hub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      # server/**/*.test.ts resolve hono from server/node_modules.
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Apply migrations
        run: npx tsx lib/db/migrate.ts

      # One file at a time: the tests share one database, and parallel files
      # exhaust Postgres' connection limit.
      - name: Run Vitest
        run: npx vitest run --no-file-parallelism

  e2e:
    name: End-to-end (Playwright)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mun_hub
          POSTGRES_PASSWORD: mun_hub_dev
          POSTGRES_DB: mun_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mun_hub -d mun_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # E2E/env.ts refuses anything that isn't a local database.
      E2E_DATABASE_URL: postgresql://mun_hub:mun_hub_dev@localhost:5432/mun_hub
      # Playwright's bundled Chromium; the default channel is an installed Chrome.
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix web ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite starts the API with `tsx --env-file=.env` from server/, and
      # that flag fails if the file is missing. Only the committed, mock-only
      # test values go in; playwright.config.ts overrides the database URL and
      # sets every E2E-specific switch (mock payments, localhost origins, the
      # email outbox, APP_URL, the raised global rate limit).
      - name: Write server/.env from .env.test
        run: cp .env.test server/.env

      - name: Run Playwright
        run: npx playwright test -c E2E/playwright.config.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The outbox holds every email the test API "sent", for debugging email specs.
          path: |
            E2E/playwright-report/
            E2E/test-results/
            E2E/.outbox/
          include-hidden-files: true
          retention-days: 14
