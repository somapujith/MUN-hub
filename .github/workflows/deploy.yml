name: Deploy (production)

# Manual only. Run it from the Actions tab on `main` once CI is green for the
# commit you want to ship. The `production` environment should require a
# reviewer (Settings → Environments → production → Required reviewers), so a
# run waits for approval before it touches Neon or Cloudflare.
#
# Order: migrations → munhub-api → munhub-web. Migrations must therefore be
# additive (the API still running at that moment has to keep working).
# munhub.in / www.munhub.in are served by Vercel from web/ and deploy through
# Vercel's own Git integration, not this workflow.
#
# Secrets on the `production` environment:
#   DATABASE_URL           Neon production branch, direct (non-pooled) URL
#   CLOUDFLARE_API_TOKEN   Workers Scripts/Routes edit on the munhub.in zone
#   CLOUDFLARE_ACCOUNT_ID
# See docs/operations/RUNBOOK.md.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply database migrations to production Neon
        type: boolean
        default: true
      deploy_api:
        description: Deploy munhub-api (api.munhub.in)
        type: boolean
        default: true
      deploy_web:
        description: Deploy munhub-web (app./publish./admin./*.munhub.in)
        type: boolean
        default: true

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Migrate and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.munhub.in
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix web ci

      # Cheap re-check of what is about to ship; CI has already run the tests.
      - name: Typecheck
        run: |
          npx tsc --noEmit -p server/tsconfig.json
          npm run typecheck:root
          npm --prefix web run typecheck

      - name: Check secrets are present
        env:
          MIGRATE: ${{ inputs.migrate }}
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set on the production environment"; missing=1; fi
          done
          if [ "$MIGRATE" = "true" ] && [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set on the production environment"; missing=1
          fi
          exit $missing

      # lib/db/migrate.ts loads .env with dotenv, which doesn't override the
      # DATABASE_URL set here (and CI has no .env anyway).
      - name: Apply migrations to Neon
        if: inputs.migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx lib/db/migrate.ts

      # --env="" selects the top-level (production) config explicitly.
      # SENTRY_RELEASE tags error reports with the deployed commit.
      - name: Deploy munhub-api
        if: inputs.deploy_api
        working-directory: server
        run: >-
          npx wrangler deploy --env=""
          --var "SENTRY_RELEASE:${GITHUB_SHA}"
          --tag "${GITHUB_SHA::7}"
          --message "GitHub Actions run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"

      # VITE_API_URL is compiled into the bundle.
      - name: Build web
        if: inputs.deploy_web
        working-directory: web
        env:
          VITE_API_URL: https://api.munhub.in/api/v1
        run: npx vite build

      - name: Deploy munhub-web
        if: inputs.deploy_web
        working-directory: web
        run: >-
          npx wrangler deploy --env=""
          --tag "${GITHUB_SHA::7}"
          --message "GitHub Actions run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"

      - name: Smoke test
        if: inputs.deploy_api
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://api.munhub.in/api/v1/health; then exit 0; fi
            sleep 5
          done
          echo "::error::https://api.munhub.in/api/v1/health did not return 200"
          exit 1
